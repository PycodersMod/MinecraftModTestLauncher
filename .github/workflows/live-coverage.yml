name: MMTL 实时覆盖审计

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: read

jobs:
  live-coverage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 生成实时完整覆盖报告
        shell: pwsh
        run: |
          $reportText = & ./windows/launcher.ps1 --coverage-report --json | Out-String
          $report = $reportText | ConvertFrom-Json -ErrorAction Stop
          $report | ConvertTo-Json -Depth 80 | Set-Content -LiteralPath coverage-report.json -Encoding utf8
          $gaps = @($report.gaps)
          $warnings = @($report.warnings)
          $invariantCodes = @('CATALOG_RELEASE_ROW_COUNT_MISMATCH', 'PROVIDER_RECORD_MISSING', 'UNKNOWN_REASON_CODE', 'UNKNOWN_WITHOUT_REASON', 'UNKNOWN_WITHOUT_NOTES', 'AVAILABLE_WITHOUT_CANDIDATE', 'COVERAGE_INCONSISTENCY', 'STATE_PROVENANCE_MISSING', 'STATE_CHECK_TIME_MISSING', 'UNSAFE_TRUST_ESCALATION', 'STATE_SOURCE_MISSING')
          $invariantErrors = @($gaps | Where-Object { $_.reasonCode -in $invariantCodes })
          $coverageErrors = @($gaps | Where-Object { $_.severity -in @('Error', 'Blocker') -and $_.reasonCode -notin $invariantCodes })
          $summary = @(
            '# 实时覆盖审计',
            "- 版本目录：$($report.minecraftCatalog.releaseCount) 个正式版本；$($report.minecraftCatalog.minimumRelease) 至 $($report.minecraftCatalog.currentStable)",
            "- 覆盖状态：$($report.summary.coverageStatus)",
            "- Provider 健康警告：$($warnings.Count)",
            "- 覆盖缺口：$($gaps.Count)",
            "- 覆盖错误（Provider/数据缺口）：$($coverageErrors.Count)",
            "- 不变量错误/阻断项：$($invariantErrors.Count)",
            '',
            '## Provider 健康状态',
            ($warnings | ForEach-Object { "- $($_.loaderId): $($_.reasonCode) — $($_.message)" }),
            '',
            '## 覆盖错误',
            ($coverageErrors | ForEach-Object { "- $($_.loaderId) $($_.minecraftId) $($_.reasonCode) — $($_.message)" }),
            '',
            '## 覆盖缺口',
            ($gaps | ForEach-Object { "- $($_.severity): $($_.loaderId) $($_.minecraftId) $($_.reasonCode) — $($_.message)" })
          )
          $summary | Set-Content -LiteralPath coverage-summary.md -Encoding utf8
          $gaps | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath coverage-gaps.json -Encoding utf8
          if ($invariantErrors.Count -gt 0) { throw 'MMTL 覆盖不变量审计发现 Error 或 Blocker 缺口。' }
      - name: 上传审计产物
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: mmtl-live-coverage-${{ github.run_id }}
          path: |
            coverage-report.json
            coverage-summary.md
            coverage-gaps.json
