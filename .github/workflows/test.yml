name: MMTL 跨平台测试
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 构建并暂存 MMTL Agent
        shell: pwsh
        run: ./common/agent/gradlew.bat --no-daemon test stageMmtlAgent
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell 语法检查
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: Windows 与 common Pester 测试
        shell: pwsh
        run: ./.github/scripts/Invoke-MmtlPester.ps1
      - name: Windows 入口安全 smoke
        shell: pwsh
        run: ./windows/launcher.ps1 --help

  ubuntu-platform-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and stage MMTL Agent
        shell: bash
        run: ./common/agent/gradlew --no-daemon test stageMmtlAgent
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell 语法检查
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: Linux 与 common Pester 测试
        shell: pwsh
        run: ./.github/scripts/Invoke-MmtlPester.ps1
      - name: Linux 入口安全 smoke
        shell: bash
        run: ./linux/launcher.sh --help

  macos-arm64-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and stage MMTL Agent
        shell: bash
        run: ./common/agent/gradlew --no-daemon test stageMmtlAgent
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装 Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell 语法检查
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: macOS ARM64 与 common Pester 测试
        shell: pwsh
        run: ./.github/scripts/Invoke-MmtlPester.ps1
