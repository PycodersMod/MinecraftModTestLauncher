name: MMTL tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell syntax
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: Full Windows Pester suite
        shell: pwsh
        run: Invoke-Pester ./tests -CI

  ubuntu-platform-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell syntax
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: Platform, runtime, Java, wrapper and Linux process tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests/Architecture.Tests.ps1,./tests/Schema.Tests.ps1,./tests/Platform.Tests.ps1,./tests/RuntimeManager.Tests.ps1,./tests/JavaResolver.Tests.ps1,./tests/GradleRunner.Tests.ps1,./tests/ProcessManager.Linux.Tests.ps1,./tests/CrossPlatformCli.Tests.ps1,./tests/MinecraftVersionCatalog.Tests.ps1,./tests/JavaRuntimeResolver.Tests.ps1,./tests/MinecraftVersionCatalog.Cli.Tests.ps1,./tests/LoaderMetadata.Tests.ps1,./tests/ForgeProvider.Tests.ps1,./tests/FabricProvider.Tests.ps1,./tests/NeoForgeProvider.Tests.ps1,./tests/QuiltProvider.Tests.ps1,./tests/LoaderAvailability.Tests.ps1,./tests/AdapterV2.Tests.ps1,./tests/ProjectDetectorV2.Tests.ps1,./tests/LoaderProvider.Cli.Tests.ps1,./tests/HistoricalSource.Tests.ps1,./tests/HistoricalMetadata.Tests.ps1,./tests/HistoricalProviders.Tests.ps1,./tests/CoverageAudit.Tests.ps1,./tests/CoverageSchema.Tests.ps1,./tests/CoverageCli.Tests.ps1,./tests/CoverageGap.Tests.ps1,./tests/CoverageLiveInputs.Tests.ps1,./tests/CoverageProviderMapping.Tests.ps1,./tests/JavaEvidence.Tests.ps1,./tests/ValidationEvidence.Tests.ps1,./tests/ValidationMatrix.Tests.ps1,./tests/ValidationPlan.Tests.ps1,./tests/ValidationSchema.Tests.ps1,./tests/ValidationRunner.Tests.ps1,./tests/RunManager.Dependency.Tests.ps1,./tests/ProcessManager.Dependency.Tests.ps1,./tests/ValidationMatrix.Aggregation.Tests.ps1,./tests/ValidationMatrix.Cli.Tests.ps1,./tests/DocumentationConsistency.Tests.ps1 -CI
      - name: launcher.sh smoke
        shell: bash
        run: ./launcher.sh --help

  macos-arm64-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: PowerShell syntax
        shell: pwsh
        run: Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object { $tokens=$null; $errors=$null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null; if($errors){throw ($errors | Out-String)} }
      - name: Platform/build-path Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests/Architecture.Tests.ps1,./tests/Schema.Tests.ps1,./tests/Platform.Tests.ps1,./tests/RuntimeManager.Tests.ps1,./tests/JavaResolver.Tests.ps1,./tests/GradleRunner.Tests.ps1,./tests/CrossPlatformCli.Tests.ps1,./tests/MinecraftVersionCatalog.Tests.ps1,./tests/JavaRuntimeResolver.Tests.ps1,./tests/MinecraftVersionCatalog.Cli.Tests.ps1,./tests/LoaderMetadata.Tests.ps1,./tests/ForgeProvider.Tests.ps1,./tests/FabricProvider.Tests.ps1,./tests/NeoForgeProvider.Tests.ps1,./tests/QuiltProvider.Tests.ps1,./tests/LoaderAvailability.Tests.ps1,./tests/AdapterV2.Tests.ps1,./tests/ProjectDetectorV2.Tests.ps1,./tests/LoaderProvider.Cli.Tests.ps1,./tests/HistoricalSource.Tests.ps1,./tests/HistoricalMetadata.Tests.ps1,./tests/HistoricalProviders.Tests.ps1,./tests/CoverageAudit.Tests.ps1,./tests/CoverageSchema.Tests.ps1,./tests/CoverageCli.Tests.ps1,./tests/CoverageGap.Tests.ps1,./tests/CoverageLiveInputs.Tests.ps1,./tests/CoverageProviderMapping.Tests.ps1,./tests/JavaEvidence.Tests.ps1,./tests/ValidationEvidence.Tests.ps1,./tests/ValidationMatrix.Tests.ps1,./tests/ValidationPlan.Tests.ps1,./tests/ValidationSchema.Tests.ps1,./tests/ValidationRunner.Tests.ps1,./tests/RunManager.Dependency.Tests.ps1,./tests/ProcessManager.Dependency.Tests.ps1,./tests/ValidationMatrix.Aggregation.Tests.ps1,./tests/ValidationMatrix.Cli.Tests.ps1,./tests/DocumentationConsistency.Tests.ps1 -CI
      - name: launcher.sh smoke
        shell: bash
        run: sh ./launcher.sh --help

  macos-intel-tests:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Platform/build-path Pester tests
        shell: pwsh
        run: Invoke-Pester -Path ./tests/Architecture.Tests.ps1,./tests/Schema.Tests.ps1,./tests/Platform.Tests.ps1,./tests/RuntimeManager.Tests.ps1,./tests/JavaResolver.Tests.ps1,./tests/GradleRunner.Tests.ps1,./tests/CrossPlatformCli.Tests.ps1,./tests/MinecraftVersionCatalog.Tests.ps1,./tests/JavaRuntimeResolver.Tests.ps1,./tests/MinecraftVersionCatalog.Cli.Tests.ps1,./tests/LoaderMetadata.Tests.ps1,./tests/ForgeProvider.Tests.ps1,./tests/FabricProvider.Tests.ps1,./tests/NeoForgeProvider.Tests.ps1,./tests/QuiltProvider.Tests.ps1,./tests/LoaderAvailability.Tests.ps1,./tests/AdapterV2.Tests.ps1,./tests/ProjectDetectorV2.Tests.ps1,./tests/LoaderProvider.Cli.Tests.ps1,./tests/HistoricalSource.Tests.ps1,./tests/HistoricalMetadata.Tests.ps1,./tests/HistoricalProviders.Tests.ps1,./tests/CoverageAudit.Tests.ps1,./tests/CoverageSchema.Tests.ps1,./tests/CoverageGap.Tests.ps1,./tests/CoverageLiveInputs.Tests.ps1,./tests/CoverageProviderMapping.Tests.ps1,./tests/JavaEvidence.Tests.ps1,./tests/ValidationEvidence.Tests.ps1,./tests/ValidationMatrix.Tests.ps1,./tests/ValidationPlan.Tests.ps1,./tests/ValidationSchema.Tests.ps1,./tests/ValidationRunner.Tests.ps1,./tests/RunManager.Dependency.Tests.ps1,./tests/ProcessManager.Dependency.Tests.ps1,./tests/ValidationMatrix.Aggregation.Tests.ps1,./tests/ValidationMatrix.Cli.Tests.ps1,./tests/DocumentationConsistency.Tests.ps1 -CI
      - name: launcher.sh smoke
        shell: bash
        run: sh ./launcher.sh --help
